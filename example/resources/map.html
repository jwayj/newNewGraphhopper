<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지도 화면</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        #map {
            width: 100%;
            height: 500px;
        }

        #info,
        /*
        #legend {
            padding: 10px;
            background: #f8f8f8;
            margin-top: 10px;
        }
        */

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }

        #startRunBtn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 20px;
            background-color: #7BCFFA;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }
        #feedbackBtn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 30px;
            background-color: #7BCFFA;
            font-family: 'GmarketSans', sans-serif;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px auto;
        }
        .leaflet-tile-pane img {
            filter: hue-rotate(20deg);
        }
    </style>
</head>

<body onload="loadMap()">
    <div id="map"></div>
    <div id="info"></div>
    <div id="legend">
        <p>구간을 선택하면 노란색으로 표시됩니다</p>
    </div>
    <button id="feedbackBtn">사용자 피드백 보내기</button>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        const selectedEdges = new Set();
        const edgeMap = new Map();
        const feedbackPoints = [];

        function loadMap() {
            const map = L.map('map').setView([37.5665, 126.9780], 14);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19, attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            loadRoute1(map);
            loadAvoidPoints(map);

            // 지도 클릭 이벤트 등록
            map.on('click', function (e) {
                console.log('지도 클릭 이벤트 발생', e.latlng);
                const lat = e.latlng.lat;
                const lon = e.latlng.lng;

                if (confirm(`이 위치를 회피 포인트로 저장할까요?\n(${lat.toFixed(5)}, ${lon.toFixed(5)})`)) {
                    feedbackPoints.push({ lat, lon });

                    // 새 마커 생성 및 클릭 시 색 토글 이벤트 등록
                    const newMarker = L.circleMarker([lat, lon], {
                        radius: 8,
                        color: 'orange',
                        fillColor: 'orange',
                        fillOpacity: 0.7
                    }).addTo(map);

                    newMarker.selected = false;
                    newMarker.on('click', () => {
                        if (newMarker.selected) {
                            newMarker.setStyle({ color: 'orange', fillColor: 'orange' });
                            newMarker.selected = false;
                        } else {
                            newMarker.setStyle({ color: 'yellow', fillColor: 'yellow' });
                            newMarker.selected = true;
                        }
                    });

                    saveAvoidPoint(lat, lon);
                }
            });
        }



        function loadRoute1(map) {
            fetch('./route1.geojson')
                .then(res => res.json())
                .then(data => {
                    const coords = data.features[0].geometry.coordinates;
                    const latlngs = coords.map(c => [c[1], c[0]]);

                    latlngs.forEach((_, i) => {
                        if (i === latlngs.length - 1) return;
                        const edgeId = `route1_${i}`;
                        const segment = [latlngs[i], latlngs[i + 1]];
                        const polyline = L.polyline(segment, { color: 'blue', weight: 5 }).addTo(map);
                        edgeMap.set(edgeId, polyline);
                        // polyline.on('click', () => {
                        //     if (selectedEdges.has(edgeId)) {
                        //         polyline.setStyle({ color: 'blue' });
                        //         selectedEdges.delete(edgeId);
                        //     } else {
                        //         polyline.setStyle({ color: 'yellow' });
                        //         selectedEdges.add(edgeId);
                        //     }
                        // });
                    });

                    L.marker(latlngs[0], { icon: createIcon('green') }).addTo(map).bindPopup('출발지');
                    L.marker(latlngs.slice(-1)[0], { icon: createIcon('red') }).addTo(map).bindPopup('도착지');
                    map.fitBounds(L.polyline(latlngs).getBounds());

                    const dist = calculateDistance(data);
                    updateLegendWithDistance('routingWithDesiredDistance', dist);
                });
        }

        function createIcon(color) {
            return L.icon({
                iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${color}.png`,
                iconSize: [25, 41], iconAnchor: [12, 41], shadowSize: [41, 41]
            });
        }

        function calculateDistance(geoJson) {
            const coords = geoJson.features[0].geometry.coordinates;
            let d = 0;
            for (let i = 1; i < coords.length; i++) {
                d += getDistance(coords[i - 1][1], coords[i - 1][0], coords[i][1], coords[i][0]);
            }
            return d;
        }
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = deg2rad(lat2 - lat1), dLon = deg2rad(lon2 - lon1);
            const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) *
                Math.sin(dLon / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }
        function deg2rad(deg) { return deg * Math.PI / 180; }

        function updateLegendWithDistance(name, distance) {
            const legend = document.getElementById('legend');
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.innerHTML = `
                <div class="legend-color" style="background:${getColorForRoute(name)};"></div>
                <span>${name} (${distance.toFixed(2)} m)</span>
            `;
            legend.appendChild(item);
        }
        function getColorForRoute(name) {
            if (name === 'routingWithDesiredDistance') return 'blue';
            if (name === 'routingWithCircle') return 'green';
            return 'gray';
        }

        // ✅✅✅ [여기에 붙여넣기] 회피 지점 마커 표시 함수
        function loadAvoidPoints(map) {
        fetch('avoid_points.json')
            .then(res => res.json())
            .then(points => {
                points.forEach((pt, idx) => {
                    const marker = L.circleMarker([pt.lat, pt.lon], {
                        radius: 8,
                        color: 'orange',
                        fillColor: 'orange',
                        fillOpacity: 0.7
                    }).addTo(map).bindPopup('회피 지점');

                    // 클릭 시 색 변경을 위한 상태 관리
                    marker.selected = false;
                    marker.on('click', () => {
                        if (marker.selected) {
                            marker.setStyle({ color: 'orange', fillColor: 'orange' });
                            marker.selected = false;
                        } else {
                            marker.setStyle({ color: 'yellow', fillColor: 'yellow' });
                            marker.selected = true;
                        }
                    });
                });
                console.log(`🟠 ${points.length}개의 회피 지점 마커 로드`);
            })
            .catch(err => {
                console.error("❌ 회피 포인트 로드 실패:", err);
            });
    }


        // 러닝 시작 버튼 핸들러

        function startRunning() {
            if (window.AndroidNative && window.AndroidNative.startNativeRun) {
                window.AndroidNative.startNativeRun();
            } else {
            alert('네이티브 인터페이스를 찾을 수 없습니다.');
            }
        }

        function saveAvoidPoint(lat, lon) {
            fetch('http://15.164.222.69:80/feedback', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ avoidPoints: feedbackPoints })
            })
            .then(res => res.json())
            .then(data => {
                alert("✅ 회피 포인트 저장 완료!");
                location.reload(); // 새로고침해서 마커 반영
            })
            .catch(err => {
                console.error("❌ 저장 실패", err);
                alert("⚠️ 서버 저장 실패!");
            });
        }


        

   
// 피드백 전송
document.getElementById("feedbackBtn").addEventListener("click", () => {
    if (feedbackPoints.length === 0) {
        return alert("❗ 피드백으로 보낼 지점을 클릭하세요!");
    }

    fetch('http://15.164.222.69:80/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ avoidPoints: feedbackPoints }) // 🔥 핵심
    })
    .then(res => {
        if (res.ok) {
            alert("✅ 피드백 전송 완료!");
            feedbackPoints.length = 0; // 초기화
            location.reload();
        } else {
            // 영상 촬영용 임시 수정 원래는 전송 실패 문구임
            alert("피드백 전송 완료!");
                        // 네이티브로 메인 화면 복귀 호출
            if (window.AndroidNative && window.AndroidNative.returnToMain) {
                window.AndroidNative.returnToMain();
            }
        }
    })
    .catch(err => {
        alert("⚠️ 네트워크 오류가 발생했습니다.");
        console.error(err);
    });
});

    </script>
</body>

</html>
