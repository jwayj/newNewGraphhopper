<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주소/거리 입력</title>
    <style>
        /* 인풋 필드 & 버튼 스타일 */
        #input input[type="text"] {
            width: 300px; height: 30px; font-size: 18px; padding: 5px;
        }
        #input input[type="radio"] { transform: scale(1.5); margin-right: 5px; }
        #input label, #input legend { font-size: 25px; }
        .large-button {
            width: 200px; height: 60px; font-size: 20px;
            color: black; border: none; border-radius: 5px; cursor: pointer;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div id="input">
        <label for="start-address">출발지:</label>
        <input type="text" id="start-address" placeholder="주소">
        <input type="button" onclick="openDaumPostcodeEmbed('start-address')" value="주소 검색">
        <button id="btnTest">현재 위치 입력</button>
        <p id="status">위치를 찾지 못했습니다</p>

        <script>
            var lat, lon; // 전역 변수 선언
            var options = {
                enableHighAccuracy: true,
                timeout: 5000,
                maximumAge: 0
            };
            
            function success(pos) {
                var crd = pos.coords;
                lat = crd.latitude;
                lon = crd.longitude;
            
                // Kakao API로 좌표 → 주소 변환 요청
                $.ajax({
                    url: 'https://dapi.kakao.com/v2/local/geo/coord2address.json?x=' + lon + '&y=' + lat,
                    type: 'GET',
                    headers: {
                        'Authorization': 'KakaoAK 54a03569d286668aec7ba4c3415a5374' // 실제 REST API 키로 대체
                    },
                    success: function(data) {
                        if (data.documents && data.documents.length > 0) {
                            var address = data.documents[0].address.address_name;
                            $('#start-address').val(address); // input에 주소 입력
                            $('#status').text('위치 확인 완료');
                        } else {
                            $('#status').text('주소를 찾지 못했습니다');
                        }
                    },
                    error: function(e) {
                        $('#status').text('주소 변환 실패');
                        console.log(e);
                    }
                });
            }
            
            function error(err) {
                $('#status').text('위치 찾기 실패');
                console.warn('ERROR(' + err.code + '): ' + err.message);
            }
            
            $("#btnTest").click(function() {
                $('#status').text('위치 확인 중...');
                navigator.geolocation.getCurrentPosition(success, error, options);
            });
            </script>
            

        <label for="end-address">도착지:</label>
        <input type="text" id="end-address" placeholder="주소">
        <input type="button" onclick="openDaumPostcodeEmbed('end-address')" value="주소 검색"><br><br>

        <input type="checkbox" id="same-as-start">
        <label for="same-as-start">출발지와 같음</label><br><br>

        <label for="distance">거리 (km):</label>
        <input type="text" id="distance" placeholder="거리를 입력하세요"><br><br>

        <fieldset>
            <legend>경사:</legend>
            <input type="radio" id="slope-low"    name="slope" value="low"><label for="slope-low">낮음</label>
            <input type="radio" id="slope-medium" name="slope" value="medium"><label for="slope-medium">보통</label>
            <input type="radio" id="slope-high"   name="slope" value="high"><label for="slope-high">높음</label>
        </fieldset><br>

        <button class="large-button" onclick="sendData()">경로 탐색</button>
    </div>

    <!-- 다음 주소검색 임베드 레이어 -->
    <div id="postcode-layer" style="display:none;position:fixed;z-index:100;width:100%;height:100%;top:0;left:0;background:rgba(0,0,0,0.3);">
        <div id="postcode-embed" style="width:400px;height:500px;margin:40px auto;background:#fff;"></div>
    </div>

    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script>
        function openDaumPostcodeEmbed(targetInputId) {
            document.getElementById('postcode-layer').style.display = 'block';
            new daum.Postcode({
                oncomplete: function(data) {
                    document.getElementById(targetInputId).value = data.address;
                    document.getElementById('postcode-layer').style.display = 'none';
                    if (window.Android) {
                        window.Android.setAddress(data.zonecode, data.address, data.buildingName);
                    }
                },
                onclose: function(state) {
                    document.getElementById('postcode-layer').style.display = 'none';
                }
            }).embed(document.getElementById('postcode-embed'));
        }

        function sendData() {
            const payload = {
                startAddress: document.getElementById("start-address").value,
                endAddress:   document.getElementById("end-address").value,
                distance:     document.getElementById("distance").value,
                same:         document.getElementById("same-as-start").checked,
                slope:        document.querySelector('input[name="slope"]:checked')?.value
            };

            fetch('http://localhost:4567/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => {
                if (!res.ok) throw new Error();
                // 지도 화면으로 이동
                window.location.href = 'maponly.html';
            })
            .catch(err => {
                alert("데이터 전송에 실패했습니다.");
                window.location.href = 'maponly.html';
                console.error(err);
            });
        }
    </script>
</body>
</html>
