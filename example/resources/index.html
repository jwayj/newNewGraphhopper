<!DOCTYPE html>
<html>
<head>
    <title>라우팅 비교 + 피드백</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <style>
        #map { width: 100%; height: 600px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
        .legend-color { width: 20px; height: 20px; margin-right: 10px; }
        #input input[type="text"] {
            width: 300px; height: 30px; font-size: 18px; padding: 5px;
        }
        #input input[type="radio"] {
            transform: scale(1.5); margin-right: 5px;
        }
        #input label, #input legend {
            font-size: 25px;
        }
        #input input {
            font-size: 25px; height: 40px;
        }
        .large-button {
            width: 200px; height: 60px; font-size: 20px; border: none; border-radius: 5px; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Daum 주소 검색 -->
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

    

    <div id="input">
        <label for="start-address">출발지:</label>
        <input type="text" id="start-address" placeholder="주소">
        <input type="button" onclick="openDaumPostcodeEmbed('start-address')" value="주소 검색"><br><br>

        <label for="end-address">도착지:</label>
        <input type="text" id="end-address" placeholder="주소">
        <input type="button" onclick="openDaumPostcodeEmbed('end-address')" value="주소 검색"><br><br>

        <input type="checkbox" id="same-as-start">
        <label for="same-as-start">출발지와 같음</label><br><br>

        <label for="distance">거리 (km):</label>
        <input type="text" id="distance" placeholder="예: 5"><br><br>

        <fieldset>
            <legend>경사:</legend>
            <input type="radio" id="slope-low" name="slope" value="low">
            <label for="slope-low">낮음</label>
            <input type="radio" id="slope-medium" name="slope" value="medium">
            <label for="slope-medium">보통</label>
            <input type="radio" id="slope-high" name="slope" value="high">
            <label for="slope-high">높음</label>
        </fieldset>
        <br>
        <button class="large-button" onclick="sendData()">경로 탐색</button>
    </div>

    <div id="postcode-layer" style="display:none;position:fixed;z-index:100;width:100%;height:100%;top:0;left:0;background:rgba(0,0,0,0.3);">
        <div id="postcode-embed" style="width:400px;height:500px;margin:40px auto;background:#fff;"></div>
    </div>

    <script>
        let isGeocoderReady = false;
    
        document.addEventListener("DOMContentLoaded", () => {
        const script = document.createElement("script");
        script.src = "https://dapi.kakao.com/v2/maps/sdk.js?appkey=d1c16c3393f46b74308ba72d84d5f73e&libraries=services&autoload=false";

        script.onload = () => {
            console.log("📦 SDK 로드됨, kakao =", window.kakao);  // ✅ 이 줄로 kakao 객체 확인

            if (window.kakao && window.kakao.maps && window.kakao.maps.load) {
                window.kakao.maps.load(() => {
                    console.log("✅ Kakao Maps SDK 완전히 로드됨");
                    window.geocoder = new kakao.maps.services.Geocoder();
                    isGeocoderReady = true;
                });
            } else {
                console.error("❌ kakao.maps.load가 없음");
            }
        };

        script.onerror = () => {
            console.error("❌ Kakao Maps SDK 스크립트 로드 실패");
        };

        document.head.appendChild(script);
    });

        // 주소 검색창 열기
        function openDaumPostcodeEmbed(targetInputId) {
            document.getElementById('postcode-layer').style.display = 'block';
            new daum.Postcode({
                oncomplete: function(data) {
                    document.getElementById(targetInputId).value = data.address;
                    document.getElementById('postcode-layer').style.display = 'none';
                },
                onclose: function() {
                    document.getElementById('postcode-layer').style.display = 'none';
                }
            }).embed(document.getElementById('postcode-embed'));
        }

        // 주소 → 좌표 변환 함수
        async function geocodeAddress(address) {
            return new Promise((resolve, reject) => {
                if (!window.geocoder) {
                    reject("❌ geocoder 초기화되지 않음");
                    return;
                }
                window.geocoder.addressSearch(address, function(results, status) {
                    if (status === kakao.maps.services.Status.OK) {
                        const result = results[0];
                        resolve({ lat: result.y, lon: result.x });
                    } else {
                        reject("❌ 주소 변환 실패: " + address);
                    }
                });
            });
        }

        
        
        async function sendData() {
            if (!isGeocoderReady) {
                alert("⏳ Kakao 지도 로딩 중입니다. 잠시만 기다려 주세요!");
                return;
            }
            const startAddress = document.getElementById("start-address").value;
            const endAddress = document.getElementById("end-address").value;
            const distance = document.getElementById("distance").value;
            const slope = document.querySelector('input[name="slope"]:checked')?.value;

            if (!startAddress || !distance || !slope) {
                alert("❗ 출발지, 거리, 경사 모두 입력해주세요.");
                return;
            }

            try {
                const start = await geocodeAddress(startAddress);
                const end = (document.getElementById("same-as-start").checked || !endAddress)
                            ? start : await geocodeAddress(endAddress);

                console.log("🟢 주소 변환 결과:");
                console.log("출발지:", startAddress, "→", start.lat, start.lon);
                console.log("도착지:", endAddress || "(출발지와 같음)", "→", end.lat, end.lon);
                console.log("거리:", distance + " km");
                console.log("경사:", slope);

                // ✅ 서버로 데이터 전송 (모두 문자열)
                const payload = {
                    startLat: String(start.lat),
                    startLon: String(start.lon),
                    endLat: String(end.lat),
                    endLon: String(end.lon),
                    distance: String(distance),
                    slope: slope
                };

                const response = await fetch("http://localhost:4567/submit", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const text = await response.text();
                alert("서버 응답: " + text);
            } catch (error) {
                console.error("❌ 주소 변환 오류:", error);
                alert("❌ 주소 변환 실패!");
            }
        }


    </script>
</body>
</html>
