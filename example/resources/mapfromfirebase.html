<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기록 상세 지도</title>
  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; }
    #map { width:100%; height:100%; }
    #legend {
      position:absolute; top:10px; right:10px;
      background:rgba(255,255,255,0.8);
      padding:6px; border-radius:4px; font-size:14px;
      z-index:1000;
    }
    #startRunBtn {
      position:absolute; bottom:20px; left:50%;
      transform:translateX(-50%);
      padding:12px 24px; font-size:18px;
      background:#7BCFFA; color:#fff; border:none;
      border-radius:6px; cursor:pointer; z-index:1000;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="legend"></div>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script>
    // Firebase 초기화
    const firebaseConfig = {
      apiKey: "AIzaSyD5PjXsmqu86IxRhIbw83HpNZz1wSD2kuc",
      authDomain: "runpt-aaae1.firebaseapp.com",
      projectId: "runpt-aaae1",
      storageBucket: "runpt-aaae1.firebasestorage.app",
      messagingSenderId: "620578686575",
      appId: "1:620578686575:web:fbbdf61ac2249ce5862f9a",
      measurementId: "G-C3NP6WJNV7"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 1) 맵 생성 및 loadRoute1 호출
    function loadMap() {
      const map = L.map('map').setView([37.5665, 126.9780], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OSM'
      }).addTo(map);
      loadRoute1(map);
    }

    // 2) AndroidBridge를 통해 ID 가져와 Firestore에서 GeoJSON 로드
    function loadRoute1(map) {
      if (!window.AndroidBridge || !AndroidBridge.getGeoJsonId) {
        console.error("⚠️ AndroidBridge.getGeoJsonId() 미등록");
        return;
      }
      const docId = AndroidBridge.getGeoJsonId();
      console.log('🔖 받은 geoJsonId:', docId);

      db.collection('geojson').doc(docId).get()
        .then(docSnap => {
          if (!docSnap.exists) throw new Error('문서를 찾을 수 없습니다');
          const geo = JSON.parse(docSnap.data().content);
          const coords = geo.features[0].geometry.coordinates;
          const latlngs = coords.map(c => [c[1], c[0]]);

          latlngs.forEach((_, i) => {
            if (i === latlngs.length - 1) return;
            L.polyline([latlngs[i], latlngs[i+1]], {
              color: 'blue', weight: 5
            }).addTo(map)
              .on('click', function() {
                const newColor = this.options.color === 'yellow'
                               ? 'blue' : 'yellow';
                this.setStyle({ color: newColor });
              });
          });

          L.marker(latlngs[0],   { icon: createIcon('green') })
           .addTo(map).bindPopup('출발지');
          L.marker(latlngs.slice(-1)[0], { icon: createIcon('red') })
           .addTo(map).bindPopup('도착지');

          map.fitBounds(L.polyline(latlngs).getBounds());
          updateLegendWithDistance('routingWithDesiredDistance',
                                   calculateDistance(geo));
        })
        .catch(console.error);
    }

    // 헬퍼 함수들
    function createIcon(color) {
      return L.icon({
        iconUrl: `https://raw.githubusercontent.com/
                       pointhi/leaflet-color-markers/
                       master/img/marker-icon-2x-${color}.png`,
        iconSize: [25, 41], iconAnchor: [12, 41],
        shadowSize: [41, 41]
      });
    }
    function calculateDistance(geoJson) {
      const coords = geoJson.features[0].geometry.coordinates;
      let d = 0;
      for (let i = 1; i < coords.length; i++) {
        d += getDistance(coords[i-1][1], coords[i-1][0],
                         coords[i][1],   coords[i][0]);
      }
      return d;
    }
    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = deg2rad(lat2 - lat1);
      const dLon = deg2rad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 +
                Math.cos(deg2rad(lat1)) *
                Math.cos(deg2rad(lat2)) *
                Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function deg2rad(deg) { return deg * Math.PI / 180; }
    function updateLegendWithDistance(name, dist) {
      const legend = document.getElementById('legend');
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `
        <div class="legend-color" style="background:${getColorForRoute(name)};"></div>
        <span>${name} (${dist.toFixed(2)} m)</span>
      `;
      legend.appendChild(item);
    }
    function getColorForRoute(name) {
      if (name === 'routingWithDesiredDistance') return 'blue';
      if (name === 'routingWithCircle')        return 'green';
      return 'gray';
    }

    // 네이티브 RunActivity 호출
    function startRunning() {
      if (window.AndroidNative && AndroidNative.startNativeRun) {
        AndroidNative.startNativeRun();
      } else {
        alert('네이티브 인터페이스가 없습니다.');
      }
    }
  </script>
</body>
</html>
