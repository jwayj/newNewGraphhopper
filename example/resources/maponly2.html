<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지도 화면</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        #info,
        /*
        #legend {
            padding: 10px;
            background: #f8f8f8;
            margin-top: 10px;
        }
        */
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }

        #startRunBtn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 20px;
            background-color: #7BCFFA;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
        }

        .leaflet-tile-pane img {
            filter: hue-rotate(20deg);
        }
    </style>
</head>

<body onload="loadMap()">
    <div id="map"></div>
    <div id="info"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <!-- Firebase (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script>
        const selectedEdges = new Set();
        const edgeMap = new Map();

        function loadMap() {
            const map = L.map('map').setView([37.5665, 126.9780], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19, attribution: '© OpenStreetMap contributors'
            }).addTo(map);

            // 실시간 위치 추적 초기화
            let yellowMarker = null;

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition( // watchPosition으로 변경[2]
                    position => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;

                        // 기존 마커 제거[2]
                        if (yellowMarker) map.removeLayer(yellowMarker);

                        // 새 마커 생성
                        yellowMarker = L.circleMarker([lat, lng], {
                            radius: 10,
                            color: 'gold',
                            fillColor: 'yellow',
                            fillOpacity: 1
                        }).addTo(map).bindPopup(`현위치 (정확도: ${position.coords.accuracy.toFixed(1)}m)`);

                        console.log("위치 정확도:", position.coords.accuracy + "m"); // 정확도 로깅[1]
                    },
                    error => alert('위치 정보 오류: ' + error.message),
                    {
                        enableHighAccuracy: true, // 고정밀 모드 활성화[1]
                        maximumAge: 0,
                        timeout: 10000
                    }
                );
            } else {
                alert('이 브라우저는 위치 정보를 지원하지 않습니다.');
            }

        }

        // ── 1) Firebase 초기화 ──
        const firebaseConfig = {
            apiKey: "AIzaSyD5PjXsmqu86IxRhIbw83HpNZz1wSD2kuc",
            authDomain: "runpt-aaae1.firebaseapp.com",
            projectId: "runpt-aaae1",
            storageBucket: "runpt-aaae1.appspot.com",
            messagingSenderId: "620578686575",
            appId: "1:620578686575:web:fbbdf61ac2249ce5862f9a",
            measurementId: "G-C3NP6WJNV7"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ── 2) 지도 생성 + Firestore에서 경로 로드 ──
        function loadMap() {
            const map = L.map('map').setView([37.5665, 126.9780], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19, attribution: '© OpenStreetMap'
            }).addTo(map);

            loadRouteFromFirestore(map);
        }

        function loadRouteFromFirestore(map) {
            // AndroidBridge로부터 문서 ID 받기
            if (!window.AndroidBridge || !AndroidBridge.getGeoJsonId) {
                return console.error("AndroidBridge.getGeoJsonId() 미등록");
            }
            const docId = AndroidBridge.getGeoJsonId();
            console.log('받은 geoJsonId:', docId);

            // Firestore에서 geojson 문서 가져오기
            db.collection('geojson').doc(docId).get()
                .then(docSnap => {
                    if (!docSnap.exists) {
                        throw new Error('문서를 찾을 수 없습니다');
                    }
                    // 'content' 필드에 GeoJSON 문자열이 저장되어 있다고 가정
                    const geo = JSON.parse(docSnap.data().content);
                    const coords = geo.features[0].geometry.coordinates;
                    const latlngs = coords.map(c => [c[1], c[0]]);

                    // 선 그리기 및 클릭 이벤트
                    latlngs.forEach((_, i) => {
                        if (i === latlngs.length - 1) return;
                        L.polyline([latlngs[i], latlngs[i + 1]], {
                            color: 'blue', weight: 5
                        }).addTo(map)
                            .on('click', function () {
                                const newColor = (this.options.color === 'yellow') ? 'blue' : 'yellow';
                                this.setStyle({ color: newColor });
                            });
                    });

                    // 시작/도착 마커
                    L.marker(latlngs[0], { icon: createIcon('green') })
                        .addTo(map).bindPopup('출발지');
                    L.marker(latlngs.slice(-1)[0], { icon: createIcon('red') })
                        .addTo(map).bindPopup('도착지');

                    // 전체 경로에 맞춰 줌
                    const poly = L.polyline(latlngs);
                    map.fitBounds(poly.getBounds());

                    // 범례에 거리 표시 (필요시)
                    updateLegendWithDistance('총거리', calculateDistance(geo));
                })
                .catch(err => console.error(err));

        }
        function createIcon(color) {
            return L.icon({
                iconUrl: `https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-${color}.png`,
                iconSize: [25, 41], iconAnchor: [12, 41], shadowSize: [41, 41]
            });
        }

        // 헬퍼: 거리 계산
        function calculateDistance(geo) {
            const coords = geo.features[0].geometry.coordinates;
            let d = 0;
            for (let i = 1; i < coords.length; i++) {
                const [lon1, lat1] = coords[i - 1];
                const [lon2, lat2] = coords[i];
                d += getDistance(lat1, lon1, lat2, lon2);
            }
            return d;
        }
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(Δφ / 2) ** 2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ / 2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function updateLegendWithDistance(name, distance) {
            const legend = document.getElementById('legend');
            const item = document.createElement('div');
            item.className = 'legend-item';
            item.innerHTML = `
                <div class="legend-color" style="background:${getColorForRoute(name)};"></div>
                <span>${name} (${distance.toFixed(2)} m)</span>
            `;
            legend.appendChild(item);
        }

        function getColorForRoute(name) {
            if (name === 'routingWithDesiredDistance') return 'blue';
            if (name === 'routingWithCircle') return 'green';
            return 'gray';
        }

        function startRunning() {
            if (window.AndroidNative && window.AndroidNative.startNativeRun) {
                window.AndroidNative.startNativeRun();
            } else {
                alert('네이티브 인터페이스를 찾을 수 없습니다.');
            }
        }
    </script>
</body>

</html>
